services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    image: coding-platform-backend:latest
    container_name: coding-platform-backend
    env_file:
      - ./Backend/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      REDIS_URL: redis://redis:6379
    ports:
      - "5000:5000"
    restart: unless-stopped
    networks:
      - coding-platform
    depends_on:
      - redis

  redis:
    image: redis:7.2.4
    container_name: coding-platform-app-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - coding-platform

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000/api}
    image: coding-platform-frontend:latest
    container_name: coding-platform-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - coding-platform

networks:
  coding-platform:
    driver: bridge
