# Secret template for sensitive backend credentials.
# Copy this file to secrets.yml and fill in base64 values:
#   cp deployment/k8s/secrets.example.yml deployment/k8s/secrets.yml
# Or run:
#   bash deployment/k8s/encode-secrets.sh
#
# IMPORTANT: Values must be base64-encoded.
# Encode a value:  echo -n 'your-value' | base64
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: nextgen
  labels:
    app: coding-platform-backend
type: Opaque
data:
  # Replace these with your actual base64-encoded values.
  MONGODB_URI: "REPLACE_WITH_BASE64_ENCODED_VALUE"
  JWT_SECRET: "REPLACE_WITH_BASE64_ENCODED_VALUE"
  EMAIL_USER: "REPLACE_WITH_BASE64_ENCODED_VALUE"
  EMAIL_PASS: "REPLACE_WITH_BASE64_ENCODED_VALUE"
  REDIS_URL: "REPLACE_WITH_BASE64_ENCODED_VALUE"
  GROQ_API_KEY: "REPLACE_WITH_BASE64_ENCODED_VALUE"
  TURNSTILE_SECRET_KEY: "REPLACE_WITH_BASE64_ENCODED_VALUE"
