# Example backend secrets template (base64 encoded)
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: nextgen
  labels:
    app: coding-platform-backend
type: Opaque
data:
  MONGODB_URI: "REPLACE_WITH_BASE64_ENCODED_VALUE"
  JWT_SECRET: "REPLACE_WITH_BASE64_ENCODED_VALUE"
  EMAIL_USER: "REPLACE_WITH_BASE64_ENCODED_VALUE"
  EMAIL_PASS: "REPLACE_WITH_BASE64_ENCODED_VALUE"
  REDIS_URL: "REPLACE_WITH_BASE64_ENCODED_VALUE"
  GROQ_API_KEY: "REPLACE_WITH_BASE64_ENCODED_VALUE"
  TURNSTILE_SECRET_KEY: "REPLACE_WITH_BASE64_ENCODED_VALUE"
