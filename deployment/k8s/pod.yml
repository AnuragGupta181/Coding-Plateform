# Standalone backend test pod
apiVersion: v1
kind: Pod
metadata:
  name: backend-test-pod
  namespace: nextgen
  labels:
    app: coding-platform-backend
    purpose: testing
spec:
  restartPolicy: Never
  containers:
    - name: backend
      image: nextgen-backend:latest
      imagePullPolicy: Never
      ports:
        - containerPort: 5000
          protocol: TCP
      envFrom:
        - configMapRef:
            name: backend-config
        - secretRef:
            name: backend-secrets
      volumeMounts:
        - name: config-volume
          mountPath: /etc/config
          readOnly: true
        - name: secret-volume
          mountPath: /etc/secrets
          readOnly: true
      resources:
        limits:
          cpu: "500m"
          memory: "512Mi"
  volumes:
    - name: config-volume
      configMap:
        name: backend-config
    - name: secret-volume
      secret:
        secretName: backend-secrets
        defaultMode: 0400
