<svg width="400" height="160" viewBox="0 0 400 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for shining text -->
    <linearGradient id="shineGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#71717a" />
      <stop offset="20%" stop-color="#333333" />
      <stop offset="40%" stop-color="#7c3aed" />
      <stop offset="60%" stop-color="#111111" />
      <stop offset="80%" stop-color="#71717a" />
      <stop offset="100%" stop-color="#71717a" />
      <!-- Animated translation of the gradient to create the shine effect -->
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0" dur="4s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Drop shadow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7c3aed" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="-1" stdDeviation="2" flood-color="#ffffff" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Big N in the background (faded but more visible) -->
  <text x="50%" y="65%" font-family="Inter, Arial, Helvetica, sans-serif" font-size="160" font-weight="900" fill="#a1a1aa" text-anchor="middle" dominant-baseline="middle" opacity="0.6">
    N
  </text>
  
  <!-- NextGen Text Animated -->
  <text x="50%" y="65%" font-family="Inter, Arial, Helvetica, sans-serif" font-size="60" font-weight="900" fill="url(#shineGradient)" text-anchor="middle" dominant-baseline="middle" filter="url(#glow)" letter-spacing="-2">
    NEXTGEN
  </text>
</svg>
